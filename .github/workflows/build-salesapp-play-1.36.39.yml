name: Build SalesAPP Play 1.36.39

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-salesapp-play-1.36.39.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA1: D0:03:2E:E6:41:95:D2:85:D2:DF:69:AE:0A:59:81:E8:94:C0:C9:3A

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get Drive access token
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY' > /tmp/drive_token
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          info=json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
          creds=service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/drive.readonly"],
          )
          creds.refresh(Request())
          print(creds.token)
          PY

      - name: Download source and signing files
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/drive_token)"
          mkdir -p /tmp/salesapp

          curl --fail-with-body -sS -L             -H "Authorization: Bearer ${TOKEN}"             "https://www.googleapis.com/drive/v3/files/1Lek9G0YnAWwkOuOEpBusILtvMeE3IlQ_?alt=media"             -o /tmp/salesapp/source.zip

          curl --fail-with-body -sS -L             -H "Authorization: Bearer ${TOKEN}"             "https://www.googleapis.com/drive/v3/files/1JsTZ9Yt1e4L0H8pdoiQtwwyEiiS0xjzm?alt=media"             -o /tmp/salesapp/SalesAPP-upload-key.jks

          curl --fail-with-body -sS -L             -H "Authorization: Bearer ${TOKEN}"             "https://www.googleapis.com/drive/v3/files/1ILl-I4GP_7BWMoI98dBQ93HSlL5fM6Bs?alt=media"             -o /tmp/salesapp/password.txt

          mkdir -p src
          unzip -q /tmp/salesapp/source.zip -d src

          STORE_PASSWORD="$(sed -n 's/^storePassword=//p' /tmp/salesapp/password.txt | head -1)"
          KEY_PASSWORD="$(sed -n 's/^keyPassword=//p' /tmp/salesapp/password.txt | head -1)"
          KEY_ALIAS="$(sed -n 's/^keyAlias=//p' /tmp/salesapp/password.txt | head -1)"

          {
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"

          mkdir -p src/signing
          cp /tmp/salesapp/SalesAPP-upload-key.jks src/signing/SalesAPP-upload-key.jks

          cat > src/keystore.properties <<EOF
          storeFile=signing/SalesAPP-upload-key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Verify upload key
        run: |
          set -euo pipefail
          ACTUAL_SHA1="$(keytool -list -v             -keystore src/signing/SalesAPP-upload-key.jks             -alias "$KEY_ALIAS"             -storepass "$STORE_PASSWORD"             | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p'             | head -1             | tr '[:lower:]' '[:upper:]')"
          echo "Upload key SHA-1: $ACTUAL_SHA1"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"

      - name: Build signed AAB
        working-directory: src
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean bundleRelease --no-daemon
          mkdir -p ../out
          cp app/build/outputs/bundle/release/*.aab ../out/SalesAPP-1.36.39-play.aab

      - name: Verify AAB
        run: |
          set -euo pipefail
          ACTUAL_SHA1="$(keytool -printcert -jarfile out/SalesAPP-1.36.39-play.aab             | sed -n 's/^[[:space:]]*SHA1:[[:space:]]*//p'             | head -1             | tr '[:lower:]' '[:upper:]')"
          echo "AAB signer SHA-1: $ACTUAL_SHA1"
          test "$ACTUAL_SHA1" = "$EXPECTED_SHA1"
          sha256sum out/SalesAPP-1.36.39-play.aab

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: SalesAPP-1.36.39-play
          path: out/SalesAPP-1.36.39-play.aab
          if-no-files-found: error
          retention-days: 7
