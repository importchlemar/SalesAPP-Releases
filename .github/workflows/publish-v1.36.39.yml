name: Publish SalesAPP 1.36.39

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.36.39.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Google tokens
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet google-auth requests
          python3 - <<'PY'
          import json, os
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          info = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])

          cloud = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/cloud-platform"],
          )
          cloud.refresh(Request())
          open("/tmp/cloud_token","w").write(cloud.token)

          drive = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/drive.readonly"],
          )
          drive.refresh(Request())
          open("/tmp/drive_token","w").write(drive.token)
          PY

      - name: Enable Drive API if needed
        continue-on-error: true
        run: |
          set -euo pipefail
          CLOUD_TOKEN="$(cat /tmp/cloud_token)"
          curl -sS -X POST             -H "Authorization: Bearer ${CLOUD_TOKEN}"             -H "Content-Type: application/json"             "https://serviceusage.googleapis.com/v1/projects/584911343019/services/drive.googleapis.com:enable"             -d '{}' > /tmp/enable_drive.json
          cat /tmp/enable_drive.json
          sleep 10

      - name: Download signed APK from Drive
        run: |
          set -euo pipefail
          ACCESS_TOKEN="$(cat /tmp/drive_token)"
          for n in 1 2 3 4 5 6; do
            HTTP_CODE="$(curl -sS -L               -H "Authorization: Bearer ${ACCESS_TOKEN}"               -w "%{http_code}"               "https://www.googleapis.com/drive/v3/files/1EH9-e3KPN8gXJISUL4V8Q5rxj6b1BgOS?alt=media"               -o /tmp/drive_response)"
            echo "Drive HTTP: $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              mv /tmp/drive_response SalesAPP.apk
              break
            fi
            cat /tmp/drive_response
            sleep 10
          done
          test -s SalesAPP.apk
          sha256sum SalesAPP.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.36.39 >/dev/null 2>&1; then
            echo "Release v1.36.39 already exists."
            exit 0
          fi
          gh release create v1.36.39 SalesAPP.apk             --repo "${{ github.repository }}"             --target main             --title "SalesAPP 1.36.39"             --notes "Dostawy z Optimy przez Google Sheets/Apps Script. Uproszczone podsumowanie, status Oczekuje na przyjęcie, numer i data PZ oraz przejście do wszystkich produktów z wybranego PZ."
