name: Resolve release service account

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Print service account email
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python3 - <<'PY'
          import json, os
          data=json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
          print("SERVICE_ACCOUNT_EMAIL="+data["client_email"])
          PY
